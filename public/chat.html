<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bella Chat</title>
<meta name="theme-color" content="#9B4D6A">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF7F2;--white:#FFFFFF;--rose:#9B4D6A;--rose-deep:#7A3554;--rose-light:#F5E8EE;
  --rose-mid:#C98CA8;--gold:#C4994A;--gold-light:#F5EDD8;--dark:#1A1214;--text:#3D2B35;
  --text-light:#8A6B76;--border:#E8D5DE;--border-light:#F0E2E8;
  --sh-sm:0 2px 8px rgba(155,77,106,.08);--sh-md:0 4px 20px rgba(155,77,106,.12);
  --r-sm:8px;--r-md:14px;--r-lg:22px;--r-xl:40px;
  --primary:var(--rose);--primary-deep:var(--rose-deep);--primary-light:var(--rose-light);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{
  font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}

/* ── HEADER ── */
.chat-header{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--sh-sm);flex-shrink:0;position:relative;
}
.back-btn{
  background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;
  color:var(--text-light);display:flex;align-items:center;justify-content:center;
  transition:background .2s;-webkit-tap-highlight-color:transparent;
}
.back-btn:active{background:var(--border-light)}
.bella-avatar{
  width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  box-shadow:var(--sh-sm);
}
.bella-info{flex:1;min-width:0}
.bella-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--dark);line-height:1.2}
.bella-status{font-size:11px;color:var(--text-light);display:flex;align-items:center;gap:5px}
.online-dot{width:7px;height:7px;border-radius:50%;background:#2D7D52;display:inline-block}

/* ── MESSAGES ── */
.messages-wrap{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.messages-wrap::-webkit-scrollbar{width:4px}
.messages-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.msg{max-width:80%;display:flex;flex-direction:column;gap:3px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.msg.bella{align-self:flex-start}
.msg.user{align-self:flex-end}

.msg-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-deep));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-bottom:2px}

.msg-row{display:flex;align-items:flex-end;gap:7px}
.msg.user .msg-row{flex-direction:row-reverse}

.bubble{
  padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.65;
  word-break:break-word;white-space:pre-wrap;
}
.msg.bella .bubble{
  background:var(--white);color:var(--text);border-bottom-left-radius:4px;
  box-shadow:var(--sh-sm);border:1px solid var(--border-light);
}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  color:white;border-bottom-right-radius:4px;box-shadow:var(--sh-sm);
}
.bubble b,.bubble strong{font-weight:700}
.bubble a{color:var(--rose);text-decoration:underline;font-weight:600}
.msg.user .bubble a{color:rgba(255,255,255,.9)}
.msg-time{font-size:10px;color:var(--text-light);padding:0 4px}
.msg.user .msg-time{text-align:right}

/* Typing indicator */
.typing-bubble{
  background:var(--white);border:1px solid var(--border-light);
  padding:12px 16px;border-radius:18px;border-bottom-left-radius:4px;
  box-shadow:var(--sh-sm);display:flex;align-items:center;gap:5px;
}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--rose-mid);animation:blink 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* ── CHIPS (booking + quick replies) ── */
.chips-wrap{
  display:flex;gap:7px;padding:6px 14px 8px;overflow-x:auto;flex-shrink:0;
  flex-wrap:wrap;max-height:92px;overflow-y:auto;
  scrollbar-width:none;
}
.chips-wrap::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;background:var(--white);border:1.5px solid var(--border);
  border-radius:50px;padding:6px 13px;font-family:'Nunito',sans-serif;
  font-size:12px;font-weight:600;color:var(--rose);cursor:pointer;
  transition:all .2s;-webkit-tap-highlight-color:transparent;flex-shrink:0;
}
.chip:active,.chip:hover{background:var(--rose-light);border-color:var(--rose)}
.chip.chip-date{color:var(--text);border-color:var(--border)}
.chip.chip-date:active,.chip.chip-date:hover{background:var(--gold-light);border-color:var(--gold);color:var(--dark)}
.chip.chip-slot{color:var(--dark);border-color:var(--border)}
.chip.chip-slot:active,.chip.chip-slot:hover{background:var(--gold-light);border-color:var(--gold)}

/* ── INPUT ── */
.input-area{
  background:var(--white);border-top:1px solid var(--border);
  padding:10px 12px 14px;display:flex;align-items:flex-end;gap:9px;flex-shrink:0;
}
.input-field{
  flex:1;border:1.5px solid var(--border);border-radius:22px;
  padding:10px 16px;font-family:'Nunito',sans-serif;font-size:14px;
  color:var(--text);background:var(--cream);resize:none;
  outline:none;transition:border-color .2s;line-height:1.5;max-height:100px;
  min-height:42px;overflow-y:auto;
}
.input-field:focus{border-color:var(--rose)}
.input-field::placeholder{color:var(--text-light)}
.send-btn{
  width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity .2s;box-shadow:var(--sh-sm);
  -webkit-tap-highlight-color:transparent;
}
.send-btn:active{opacity:.8}
.send-btn svg{width:18px;height:18px;fill:white}
.send-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── LOADING INIT ── */
.init-loader{
  position:fixed;inset:0;background:var(--cream);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.init-loader .bella-avatar-lg{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  display:flex;align-items:center;justify-content:center;font-size:36px;
  box-shadow:var(--sh-md);
}
.init-loader p{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--rose)}
.init-loader span{font-size:12px;color:var(--text-light)}
.spin{width:24px;height:24px;border:2.5px solid var(--border);border-top-color:var(--rose);border-radius:50%;animation:spin .7s linear infinite;margin-top:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:white;padding:10px 18px;border-radius:50px;font-size:12px;font-weight:600;z-index:200;opacity:0;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#C4564A}

/* responsive */
@media(max-width:420px){
  .bubble{font-size:13px;padding:9px 12px}
  .msg{max-width:88%}
}
</style>
</head>
<body>

<div class="init-loader" id="loader">
  <div class="bella-avatar-lg">🌸</div>
  <p>Bella</p>
  <span>Iniciando o chat…</span>
  <div class="spin"></div>
</div>

<div id="chat-app" class="hidden" style="display:flex;flex-direction:column;height:100%">
  <!-- Header -->
  <div class="chat-header">
    <button class="back-btn" onclick="history.length>1?history.back():location.href='/'" title="Voltar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="bella-avatar">🌸</div>
    <div class="bella-info">
      <div class="bella-name">Bella</div>
      <div class="bella-status"><span class="online-dot"></span> Assistente virtual</div>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-wrap" id="messages"></div>

  <!-- Chips (quick replies / booking) -->
  <div class="chips-wrap" id="chipsArea">
    <button class="chip" onclick="sendQuick('📅 Quero agendar')">📅 Agendar</button>
    <button class="chip" onclick="sendQuick('🌿 Quais são os serviços?')">🌿 Serviços</button>
    <button class="chip" onclick="sendQuick('💫 Quais os preços?')">💫 Preços</button>
    <button class="chip" onclick="sendQuick('📍 Qual é a localização?')">📍 Localização</button>
    <button class="chip" onclick="sendQuick('📱 WhatsApp')">📱 WhatsApp</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea class="input-field" id="msgInput" placeholder="Digite sua mensagem…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let SESSION_ID   = null;
let VISITOR_NAME = null;
let isSending    = false;

// Booking flow state
const booking = {
  active:  false,
  step:    null,   // 'service' | 'city' | 'date' | 'slot'
  cities:  [],
  services:[],
  cityId:  null,
  cityName:'',
  procId:  null,
  procName:'',
  date:    null,
  slot:    null,
};

// ── Init ─────────────────────────────────────────────────────────────────────
const HISTORY_TTL_MS = 24 * 60 * 60 * 1000; // 24h

(async function init() {
  try {
    const lastActivity = parseInt(localStorage.getItem('bella_last') || '0', 10);
    if (lastActivity && Date.now() - lastActivity > HISTORY_TTL_MS) {
      localStorage.removeItem('bella_sid');
      localStorage.removeItem('bella_last');
    }
    SESSION_ID = localStorage.getItem('bella_sid');
  } catch {}

  if (!SESSION_ID) {
    SESSION_ID = 'b' + Date.now() + Math.random().toString(36).slice(2,8);
    try { localStorage.setItem('bella_sid', SESSION_ID); } catch {}
  }

  try {
    const r = await fetch('/api/chat/init', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: SESSION_ID })
    });
    const data = await r.json();
    VISITOR_NAME = data.visitor_name || null;

    if (data.history?.length) {
      for (const m of data.history) {
        if (m.content === '__init__') continue;
        renderMsg(m.role, m.content, false);
      }
    } else {
      const bizName = data.business_name || 'nosso espaço';
      const greeting = `Olá! 👋 Sou a Bella, assistente virtual de *${bizName}*.\n\nPara começar, como posso te chamar?`;
      renderMsg('bella', greeting, true);
      fetch('/api/chat/message', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ session_id: SESSION_ID, message: '__greeting__', visitor_name: null })
      }).catch(()=>{});
    }
    scrollBottom();
    try { localStorage.setItem('bella_last', String(Date.now())); } catch {}
  } catch(e) {
    showToast('Erro ao conectar. Tente novamente.', true);
  }

  document.getElementById('loader').classList.add('hidden');
  const app = document.getElementById('chat-app');
  app.classList.remove('hidden');
  app.style.display = 'flex';

  const inp = document.getElementById('msgInput');
  inp.addEventListener('input', onInput);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  autoGrow(inp);
  document.getElementById('sendBtn').disabled = false;
})();

// ── Helpers ──────────────────────────────────────────────────────────────────
function scrollBottom() {
  const w = document.getElementById('messages');
  w.scrollTop = w.scrollHeight;
}

function fmtTime(d) {
  const dt = d ? new Date(d) : new Date();
  return dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

function renderMarkdown(text) {
  return text
    .replace(/\*([^*]+)\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMsg(role, content, animate = true) {
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (!animate) div.style.animation = 'none';

  const row = document.createElement('div');
  row.className = 'msg-row';

  if (role === 'bella') {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = '🌸';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdown(content);

  row.appendChild(bubble);
  div.appendChild(row);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = fmtTime();
  div.appendChild(time);

  wrap.appendChild(div);
  scrollBottom();
  return div;
}

function showTyping() {
  const wrap = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bella';
  div.id = 'typing-ind';
  const row = document.createElement('div');
  row.className = 'msg-row';
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = '🌸';
  const tb = document.createElement('div');
  tb.className = 'typing-bubble';
  tb.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  row.appendChild(av);
  row.appendChild(tb);
  div.appendChild(row);
  wrap.appendChild(div);
  scrollBottom();
}

function hideTyping() {
  const el = document.getElementById('typing-ind');
  if (el) el.remove();
}

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (err ? ' err' : '') + ' show';
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function onInput(e) {
  autoGrow(e.target);
  document.getElementById('sendBtn').disabled = !e.target.value.trim();
}

// ── Chips ────────────────────────────────────────────────────────────────────
function setDefaultChips() {
  const area = document.getElementById('chipsArea');
  area.innerHTML = `
    <button class="chip" onclick="sendQuick('📅 Quero agendar')">📅 Agendar</button>
    <button class="chip" onclick="sendQuick('🌿 Quais são os serviços?')">🌿 Serviços</button>
    <button class="chip" onclick="sendQuick('💫 Quais os preços?')">💫 Preços</button>
    <button class="chip" onclick="sendQuick('📍 Qual é a localização?')">📍 Localização</button>
    <button class="chip" onclick="sendQuick('📱 WhatsApp')">📱 WhatsApp</button>
  `;
}

function setChips(chips) {
  // chips = [{label, fn}]
  const area = document.getElementById('chipsArea');
  area.innerHTML = '';
  for (const c of chips) {
    const btn = document.createElement('button');
    btn.className = 'chip ' + (c.cls || '');
    btn.textContent = c.label;
    btn.onclick = c.fn;
    area.appendChild(btn);
  }
}

// ── Booking flow ─────────────────────────────────────────────────────────────
async function startBookingFlow() {
  booking.active = true;
  booking.step   = null;
  booking.cityId = null;
  booking.procId = null;
  booking.date   = null;
  booking.slot   = null;

  showTyping();
  try {
    // Carregar cidades
    const citiesRes = await fetch('/api/bella/availability?step=cities');
    booking.cities = citiesRes.ok ? await citiesRes.json() : [];
    // Carregar serviços
    const svcRes = await fetch('/api/bella/availability?step=services');
    booking.services = svcRes.ok ? await svcRes.json() : [];
  } catch {}
  hideTyping();

  if (!booking.services.length) {
    booking.active = false;
    renderMsg('bella', 'No momento não há serviços cadastrados. Entre em contato pelo WhatsApp para agendar! 📱');
    setDefaultChips();
    return;
  }

  // Se há apenas 1 cidade, pula para serviços direto
  if (booking.cities.length <= 1) {
    booking.cityId   = booking.cities[0]?.id || null;
    booking.cityName = booking.cities[0]?.name || '';
    askService();
  } else {
    askCity();
  }
}

function askCity() {
  booking.step = 'city';
  const greeting = VISITOR_NAME ? `${VISITOR_NAME.split(' ')[0]}, ` : '';
  renderMsg('bella', `${greeting}Em qual cidade você prefere ser atendida? 📍`);
  setChips(booking.cities.map(c => ({
    label: c.name,
    fn: () => selectCity(c.id, c.name)
  })));
}

function selectCity(id, name) {
  booking.cityId   = id;
  booking.cityName = name;
  renderMsg('user', name);
  askService();
}

async function askService() {
  booking.step = 'service';
  // Recarrega serviços filtrados pela cidade selecionada
  if (booking.cityId) {
    try {
      const r = await fetch(`/api/bella/availability?step=services&cityId=${booking.cityId}`);
      if (r.ok) booking.services = await r.json();
    } catch {}
  }

  if (!booking.services.length) {
    renderMsg('bella', 'Ops! Não há serviços disponíveis para essa localidade. Posso te ajudar com outra coisa?');
    booking.active = false;
    setDefaultChips();
    return;
  }

  const greeting = VISITOR_NAME ? `${VISITOR_NAME.split(' ')[0]}, ` : '';
  const cityPart = booking.cityName ? ` em *${booking.cityName}*` : '';
  renderMsg('bella', `${greeting}Qual serviço você deseja agendar${cityPart}? 🌸`);
  setChips(booking.services.map(s => {
    const price = s.price ? ` · R$ ${Number(s.price).toFixed(2).replace('.',',')}` : '';
    return {
      label: s.name + price,
      fn: () => selectService(s.id, s.name)
    };
  }));
}

async function selectService(id, name) {
  booking.procId   = id;
  booking.procName = name;
  renderMsg('user', name);
  await askDate();
}

async function askDate() {
  booking.step = 'date';
  showTyping();
  let dates = [];
  try {
    const r = await fetch(`/api/bella/availability?step=dates&procId=${booking.procId}&cityId=${booking.cityId || 1}`);
    if (r.ok) dates = await r.json();
  } catch {}
  hideTyping();

  if (!dates.length) {
    renderMsg('bella', 'Não encontrei datas disponíveis nos próximos 21 dias. 😔\n\nEntre em contato pelo WhatsApp para verificar outras opções!');
    booking.active = false;
    setDefaultChips();
    return;
  }

  renderMsg('bella', `Ótimo! Escolha uma data disponível: 🗓️`);
  setChips(dates.map(d => ({
    label: fmtDate(d),
    cls:   'chip-date',
    fn:    () => selectDate(d)
  })));
}

async function selectDate(dateStr) {
  booking.date = dateStr;
  renderMsg('user', fmtDate(dateStr));
  await askSlot();
}

async function askSlot() {
  booking.step = 'slot';
  showTyping();
  let slots = [];
  try {
    const r = await fetch(`/api/bella/availability?step=slots&procId=${booking.procId}&cityId=${booking.cityId || 1}&date=${booking.date}`);
    if (r.ok) slots = await r.json();
  } catch {}
  hideTyping();

  if (!slots.length) {
    renderMsg('bella', 'Não há horários disponíveis nessa data. Vamos tentar outra? 🗓️');
    await askDate();
    return;
  }

  renderMsg('bella', `Perfeito! Escolha um horário: ⏰`);
  setChips(slots.map(s => ({
    label: s,
    cls:   'chip-slot',
    fn:    () => selectSlot(s)
  })));
}

function selectSlot(slot) {
  booking.slot = slot;
  renderMsg('user', slot);
  confirmBooking();
}

function confirmBooking() {
  booking.step = 'confirm';
  const cityPart = booking.cityName ? `\n📍 *Local:* ${booking.cityName}` : '';
  const summary =
    `Ótimo! Aqui está o resumo do seu agendamento: ✨\n\n` +
    `🌿 *Serviço:* ${booking.procName}` +
    cityPart +
    `\n🗓️ *Data:* ${fmtDate(booking.date)}` +
    `\n⏰ *Horário:* ${booking.slot}\n\n` +
    `Para confirmar, acesse nossa agenda e finalize o agendamento!\n\n👉 [Agendar agora](/)`;
  renderMsg('bella', summary);
  booking.active = false;
  setTimeout(setDefaultChips, 800);
}

function fmtDate(d) {
  // "2025-09-24" → "Ter, 24/09"
  const [y,m,dd] = d.split('-').map(Number);
  const dt = new Date(y, m-1, dd);
  const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return `${days[dt.getDay()]}, ${String(dd).padStart(2,'0')}/${String(m).padStart(2,'0')}`;
}

// ── Send ─────────────────────────────────────────────────────────────────────
async function sendToServer(message) {
  try {
    const r = await fetch('/api/chat/message', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        session_id: SESSION_ID,
        message,
        visitor_name: VISITOR_NAME || undefined
      })
    });
    const data = await r.json();
    if (data.visitor_name) VISITOR_NAME = data.visitor_name;
    return data.response || null;
  } catch(e) { return null; }
}

async function sendMessage() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text || isSending) return;

  isSending = true;
  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  if (booking.active) {
    // Usuário digitou no campo enquanto fluxo de chips está ativo — reseta o fluxo
    booking.active = false;
    setDefaultChips();
  }

  renderMsg('user', text);
  showTyping();

  const response = await sendToServer(text);
  hideTyping();

  if (!response) {
    showToast('Não consegui responder agora. Tente novamente.', true);
    isSending = false;
    document.getElementById('sendBtn').disabled = false;
    inp.focus();
    return;
  }

  // Marcador especial: inicia fluxo de agendamento por chips
  if (response === '__BOOKING_START__') {
    await startBookingFlow();
  } else {
    renderMsg('bella', response);
    setDefaultChips();
  }

  isSending = false;
  document.getElementById('sendBtn').disabled = false;
  inp.focus();
}

async function sendQuick(text) {
  if (isSending) return;
  document.getElementById('msgInput').value = text;
  document.getElementById('sendBtn').disabled = false;
  await sendMessage();
}
