<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bella – Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    /* ── Design tokens — LIGHT ONLY (sem dark mode) ──────────────────── */
    :root {
      --cream:        #FAFAF8;
      --rose:         #9B4D6A;
      --rose-rgb:     155, 77, 106;
      --rose-light:   #c47a97;
      --gold:         #C4994A;
      --dark:         #1A1214;
      --text:         #3D2B35;
      --muted:        #7a6370;
      --chip-bg:      #f3ede8;
      --chip-border:  #d4bcc8;
      --chip-color:   #9B4D6A;
      --surface:      #fff;
      --shadow:       rgba(155,77,106,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: var(--cream);
    }

    /* ── Header ──────────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 12px;
      background: var(--rose);
      color: #fff;
      flex-shrink: 0;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
    }
    #header-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    #header-info { flex: 1; }
    #header-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 600;
      line-height: 1.2;
    }
    #header-status { font-size: 12px; opacity: .8; }
    #btn-close {
      background: none; border: none; color: #fff;
      font-size: 22px; cursor: pointer; padding: 4px 8px;
      border-radius: 8px; line-height: 1;
      transition: background .15s;
    }
    #btn-close:hover { background: rgba(255,255,255,.15); }

    /* ── Mensagens ───────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      display: flex;
      gap: 8px;
      max-width: 88%;
      animation: fadeUp .25s ease;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(8px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .msg.bella { align-self: flex-start; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--rose); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-top: auto;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14.5px; line-height: 1.55;
      word-break: break-word;
    }
    /* Bella: fundo levíssimo na cor do tenant — sempre claro */
    .msg.bella .bubble {
      background: rgba(var(--rose-rgb), 0.09);
      color: #1A1214;
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 4px rgba(var(--rose-rgb), 0.10);
    }
    /* Usuário: sólido na cor do tenant, texto branco */
    .msg.user .bubble {
      background: var(--rose);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    /* ── Typing ──────────────────────────────────────────────────────── */
    .typing-dots { display: flex; gap: 4px; padding: 4px 2px; }
    .typing-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--rose-light);
      animation: bounce .9s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-6px); }
    }

    /* ── Chips ───────────────────────────────────────────────────────── */
    #chip-area {
      flex-shrink: 0;
      padding: 8px 14px 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid rgba(var(--rose-rgb), .10);
      background: var(--cream);
      min-height: 52px;
      align-items: center;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px;
      background: var(--chip-bg);
      border: 1.5px solid var(--chip-border);
      border-radius: 999px;
      font-family: 'Nunito', sans-serif;
      font-size: 13.5px; font-weight: 700;
      color: var(--chip-color);
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s, opacity .15s;
      white-space: nowrap;
      letter-spacing: .1px;
    }
    .chip:hover {
      background: rgba(var(--rose-rgb), 0.18);
      border-color: var(--rose);
    }
    .chip:active { transform: scale(.96); }
    .chip.primary {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
      box-shadow: 0 2px 8px rgba(var(--rose-rgb), 0.32);
    }
    .chip.primary:hover {
      background: rgba(var(--rose-rgb), 0.85);
      filter: brightness(0.92);
    }

    /* ── Input ───────────────────────────────────────────────────────── */
    #input-area {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
      background: var(--cream);
      border-top: 1px solid rgba(var(--rose-rgb), .10);
      flex-wrap: wrap;
    }
    #msg-input {
      flex: 1;
      min-width: 0;
      border: 1.5px solid var(--chip-border);
      border-radius: 22px;
      padding: 10px 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 14.5px;
      color: #1A1214;
      background: #fff;
      outline: none;
      resize: none;
      line-height: 1.4;
      max-height: 100px;
      overflow-y: auto;
      transition: border-color .15s;
    }
    #msg-input:focus { border-color: var(--rose); }
    #msg-input::placeholder { color: var(--muted); }
    #btn-send {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 50%; border: none;
      background: var(--rose); color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, transform .1s;
      font-size: 18px;
    }
    #btn-send:hover  { filter: brightness(0.88); }
    #btn-send:active { transform: scale(.92); }
    #btn-send:disabled { background: #ccc; cursor: default; }

    /* ── Botão encerrar ──────────────────────────────────────────────── */
    #btn-end-chat {
      display: none;
      width: 100%;
      padding: 13px;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      letter-spacing: .2px;
      margin-top: 4px;
    }
    #btn-end-chat:hover { background: #3d1a25; }

    /* ── Summary card ────────────────────────────────────────────────── */
    .summary-card {
      background: var(--surface);
      border: 1.5px solid var(--chip-border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.7;
    }
    .summary-card h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px; font-weight: 600;
      color: var(--rose); margin-bottom: 6px;
    }
    .summary-row { display: flex; gap: 8px; }
    .summary-label { color: var(--muted); min-width: 70px; }

    /* ── Ações pós-confirmação ───────────────────────────────────────── */
    .post-booking-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .post-booking-actions a {
      display: block;
      padding: 10px 16px;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px; font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .post-booking-actions a:active { transform: scale(.97); }
    .btn-whatsapp {
      background: #25D366;
      color: #fff !important;
    }
    .btn-whatsapp:hover { filter: brightness(0.90); }
    .btn-calendar {
      background: rgba(var(--rose-rgb), 0.09);
      color: var(--rose) !important;
      border: 1.5px solid rgba(var(--rose-rgb), 0.3);
    }
    .btn-calendar:hover { background: rgba(var(--rose-rgb), 0.17); }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-avatar">🌸</div>
    <div id="header-info">
      <div id="header-name">Bella</div>
      <div id="header-status">Assistente virtual</div>
    </div>
    <button id="btn-close" title="Fechar" onclick="closeApp()">✕</button>
  </div>

  <div id="messages"></div>
  <div id="chip-area"></div>

  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="Digite sua mensagem..." disabled></textarea>
    <button id="btn-send" disabled onclick="sendMessage()">➤</button>
    <button id="btn-end-chat" onclick="closeApp()">Fechar esta conversa</button>
  </div>
</div>

<script>
// ── Estado global ────────────────────────────────────────────────────
let cfg = {};
let session_id = null;
let visitorName = null;
let visitorPhone = null;
let inputLocked = false;
let _nextInput = null; // callback para próxima entrada de texto

const bk = {
  active: false, step: null,
  categories: [], services: [], cities: [],
  categoryId: null, categoryName: null,
  procId: null, procName: null, procDur: null,
  cityId: null, cityName: null, cityAddress: null,
  date: null, slot: null,
};

// ── DOM refs ─────────────────────────────────────────────────────────
const $msgs   = document.getElementById('messages');
const $chips  = document.getElementById('chip-area');
const $input  = document.getElementById('msg-input');
const $send   = document.getElementById('btn-send');
const $endBtn = document.getElementById('btn-end-chat');

// ── Helpers DOM ──────────────────────────────────────────────────────
function scrollBottom() {
  requestAnimationFrame(() => { $msgs.scrollTop = $msgs.scrollHeight; });
}

function addMsg(role, content, isHtml) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'bella' ? '🌸' : '👤';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  if (isHtml) bub.innerHTML = content;
  else bub.textContent = content;
  wrap.append(av, bub);
  $msgs.append(wrap);
  scrollBottom();
  return wrap;
}
const addBellaHtml = h => addMsg('bella', h, true);
const addUserMsg   = t => addMsg('user', t, false);

function showTyping() {
  return addBellaHtml('<div class="typing-dots"><span></span><span></span><span></span></div>');
}

async function bellaDelay(html, delay) {
  const t = showTyping();
  await new Promise(r => setTimeout(r, delay || 650));
  t.remove();
  addBellaHtml(html);
}

function setChips(chips) {
  $chips.innerHTML = '';
  $endBtn.style.display = 'none';
  chips.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (c.primary ? ' primary' : '');
    btn.textContent = c.label;
    btn.onclick = c.action;
    $chips.append(btn);
  });
}

function clearChips() {
  $chips.innerHTML = '';
  $endBtn.style.display = 'none';
}

function showEndButton() {
  $chips.innerHTML = '';
  $input.style.display = 'none';
  $send.style.display = 'none';
  $endBtn.style.display = 'block';
}

function setInputEnabled(on) {
  inputLocked = !on;
  $input.disabled = !on;
  $send.disabled  = !on;
  if (on) $input.focus();
}

function fmtDate(d) {
  const [y,m,dd] = d.split('-').map(Number);
  const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return `${days[new Date(y,m-1,dd).getDay()]}, ${String(dd).padStart(2,'0')}/${String(m).padStart(2,'0')}`;
}

// ── LocalStorage: só nome e telefone ────────────────────────────────
function loadSaved() {
  try { return { name: localStorage.getItem('bella_name') || null, phone: localStorage.getItem('bella_phone') || null }; }
  catch { return { name: null, phone: null }; }
}
function saveName(n)  { try { localStorage.setItem('bella_name', n);  } catch {} }
function savePhone(p) { try { localStorage.setItem('bella_phone', p); } catch {} }

// ── Fechar app ───────────────────────────────────────────────────────
function closeApp() {
  window.close();
  setTimeout(() => { history.back(); }, 300);
}

// ── Despedida e encerramento (helper reutilizável) ───────────────────
async function farewell() {
  setInputEnabled(false);
  const first = visitorName ? visitorName.split(' ')[0] : '';
  const dateInfo = bk.date
    ? `Sua agenda foi confirmada para <strong>${fmtDate(bk.date)}</strong> às <strong>${bk.slot}</strong>.<br><br>` : '';
  await bellaDelay(
    `Muito obrigada, <strong>${first}</strong>! 🌸<br><br>${dateInfo}Te aguardamos com carinho! Até logo 💕`,
    750
  );
  await new Promise(r => setTimeout(r, 500));
  showEndButton();
}

// ── Inicialização ────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('/api/config');
    cfg = await r.json();
    if (cfg.primary_color) {
      document.documentElement.style.setProperty('--rose', cfg.primary_color);
      // Converte hex → RGB para uso em rgba() com opacidade
      const hex = cfg.primary_color.replace('#', '');
      const r2 = parseInt(hex.slice(0,2), 16);
      const g  = parseInt(hex.slice(2,4), 16);
      const b  = parseInt(hex.slice(4,6), 16);
      if (!isNaN(r2) && !isNaN(g) && !isNaN(b)) {
        document.documentElement.style.setProperty('--rose-rgb', `${r2},${g},${b}`);
        document.documentElement.style.setProperty('--chip-color', cfg.primary_color);
        document.documentElement.style.setProperty('--chip-border', `rgba(${r2},${g},${b},0.4)`);
      }
    }
    if (cfg.business_name) {
      document.getElementById('header-name').textContent = 'Bella – ' + cfg.business_name;
    }
  } catch {}

  try {
    session_id = crypto.randomUUID();
  } catch {
    session_id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0;
      return (c==='x' ? r : (r&0x3|0x8)).toString(16);
    });
  }

  const saved = loadSaved();
  visitorName  = saved.name;
  visitorPhone = saved.phone;

  if (saved.name && saved.phone) {
    await startWithConfirmation();
  } else if (saved.name) {
    await bellaDelay(`Olá, <strong>${saved.name}</strong>! Que bom ter você de volta! 🌸<br><br>Qual é o seu telefone com DDD para confirmarmos?`, 900);
    await askPhone();
  } else {
    await bellaDelay('Olá! 🌸 Seja muito bem-vinda! Eu sou a <strong>Bella</strong>, sua assistente virtual.<br><br>Para começar, como posso te chamar?', 900);
    setInputEnabled(true);
    $input.placeholder = 'Digite seu nome...';
    _nextInput = handleName;
  }
}

// ── Coleta de nome ───────────────────────────────────────────────────
async function handleName(txt) {
  const name = txt.trim();
  if (!name) { setInputEnabled(true); return; }
  _nextInput = null;
  visitorName = name;
  saveName(name);
  addUserMsg(name);
  setInputEnabled(false);
  await bellaDelay(`Que lindo nome! 😍 Prazer, <strong>${name.split(' ')[0]}</strong>!<br><br>Agora preciso do seu telefone com DDD:`, 700);
  await askPhone();
}

// ── Coleta de telefone ───────────────────────────────────────────────
async function askPhone() {
  $input.placeholder = 'Ex: 11 99999-9999';
  setInputEnabled(true);
  _nextInput = async (txt) => {
    const digits = txt.trim().replace(/\D/g, '');
    if (digits.length < 8) {
      await bellaDelay('Por favor, informe um número válido com DDD 😊', 350);
      setInputEnabled(true);
      return;
    }
    _nextInput = null;
    visitorPhone = txt.trim();
    savePhone(txt.trim());
    addUserMsg(txt.trim());
    setInputEnabled(false);
    try {
      await fetch('/api/chat/session', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id, visitor_name: visitorName, visitor_phone: visitorPhone })
      });
    } catch {}
    await askLgpdConsent();
  };
}

// ── LGPD: consentimento obrigatório antes do fluxo principal ────────
async function askLgpdConsent() {
  const termsUrl = cfg.terms_url || '/termos';
  await bellaDelay(
    `Para prosseguir, preciso da sua confirmação 🔒<br><br>` +
    `Ao continuar, você concorda com nossa <a href="${termsUrl}" target="_blank" style="color:var(--rose);text-decoration:underline;">Política de Privacidade e Termos de Uso</a>, ` +
    `conforme a <strong>LGPD (Lei 13.709/2018)</strong>.`,
    700
  );
  setChips([
    { label: '✓ Li e concordo', primary: true, action: async () => {
        clearChips();
        addUserMsg('Li e concordo com os termos');
        await startMainFlow();
    }},
  ]);
}

// ── Confirmação de retorno ───────────────────────────────────────────
async function startWithConfirmation() {
  await bellaDelay(
    `Olá, <strong>${visitorName.split(' ')[0]}</strong>! Que prazer ter você de volta! 🌸<br><br>` +
    `Só confirmar rapidinho — seu telefone ainda é <strong>${visitorPhone}</strong>?`,
    900
  );
  setChips([
    { label: '✓ Sim, está certo', primary: true, action: async () => {
        clearChips();
        await startMainFlow();
    }},
    { label: 'Não, quero atualizar', action: async () => {
        clearChips();
        visitorPhone = null;
        await bellaDelay('Sem problemas! Qual é o seu telefone com DDD?', 400);
        await askPhone();
    }},
  ]);
}

// ── Fluxo principal ──────────────────────────────────────────────────
async function startMainFlow() {
  const first = visitorName.split(' ')[0];
  await bellaDelay(`${first}, é um prazer te atender! 🌸 Em que posso te ajudar hoje?`, 700);
  setDefaultChips();
  setInputEnabled(true);
  $input.placeholder = 'Digite sua mensagem...';
}

function setDefaultChips() {
  setChips([
    { label: '📅 Agendar', primary: true, action: () => startBookingFlow() },
    { label: '📍 Localização',            action: () => handleChipMsg('Onde vocês ficam?') },
    { label: '⏰ Horários',               action: () => handleChipMsg('Quais são os horários de atendimento?') },
    { label: '💬 WhatsApp',              action: () => handleChipMsg('whatsapp') },
  ]);
}

async function handleChipMsg(txt) {
  clearChips();
  addUserMsg(txt);
  setInputEnabled(false);
  await sendToServer(txt);
  setDefaultChips();
  setInputEnabled(true);
}

// ── Envio de mensagem ────────────────────────────────────────────────
function sendMessage() {
  const txt = $input.value.trim();
  if (!txt || inputLocked) return;
  $input.value = '';
  $input.style.height = '';
  if (_nextInput) { _nextInput(txt); return; }
  clearChips();
  addUserMsg(txt);
  setInputEnabled(false);
  sendToServer(txt).then(() => {
    setDefaultChips();
    setInputEnabled(true);
  });
}

$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 100) + 'px';
});

async function sendToServer(txt) {
  const t = showTyping();
  try {
    const r = await fetch('/api/chat/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id, message: txt, visitor_name: visitorName, visitor_phone: visitorPhone })
    });
    const data = await r.json();
    t.remove();
    if (data.response === '__BOOKING_START__') {
      startBookingFlow();
    } else {
      addBellaHtml((data.response || '').replace(/\n/g, '<br>'));
    }
  } catch {
    t.remove();
    addBellaHtml('Desculpe, ocorreu um erro. Tente novamente 🙏');
  }
}

// ════════════════════════════════════════════════════════════════════
// FLUXO DE AGENDAMENTO — 100% chips
// ════════════════════════════════════════════════════════════════════
async function startBookingFlow() {
  bk.active = true;
  bk.step = 'category';
  Object.assign(bk, {
    categoryId: null, categoryName: null,
    procId: null, procName: null, procDur: null,
    cityId: null, cityName: null, cityAddress: null,
    date: null, slot: null,
  });
  clearChips();
  setInputEnabled(false);

  const t = showTyping();
  let cats = [];
  try {
    const r = await fetch('/api/bella/availability?step=categories');
    cats = await r.json();
  } catch {}
  t.remove();

  if (cats.length > 0) {
    bk.categories = cats;
    addBellaHtml('Ótimo! Vamos agendar juntos 🗓️<br><br>Qual <strong>categoria</strong> de serviço você procura?');
    setChips(cats.map(c => ({ label: c.name, action: () => pickCategory(c) })));
  } else {
    await loadServicesDirectly();
  }
}

async function loadServicesDirectly() {
  bk.step = 'service';
  const t = showTyping();
  let svcs = [];
  try {
    const r = await fetch('/api/bella/availability?step=services');
    svcs = await r.json();
    t.remove();
  } catch {
    t.remove();
    addBellaHtml('Não consegui carregar os serviços. Tente novamente 🙏');
    setDefaultChips(); setInputEnabled(true); return;
  }

  if (!svcs.length) {
    addBellaHtml('Não há serviços disponíveis no momento 😔<br><br>Entre em contato pelo WhatsApp para outras opções!');
    setDefaultChips(); setInputEnabled(true); return;
  }
  bk.services = svcs;

  addBellaHtml('Ótimo! Vamos agendar juntos 🗓️<br><br>Qual <strong>serviço</strong> você deseja?');
  setChips(svcs.map(s => ({
    label: s.dur ? `${s.name} (${s.dur}min)` : s.name,
    action: () => pickService(s)
  })));
}

async function pickCategory(cat) {
  bk.categoryId = cat.id; bk.categoryName = cat.name;
  bk.step = 'service';
  addUserMsg(cat.name);
  clearChips();

  const t = showTyping();
  let svcs = [];
  try {
    const r = await fetch(`/api/bella/availability?step=services&categoryId=${cat.id}`);
    svcs = await r.json();
    t.remove();
  } catch {
    t.remove();
    addBellaHtml('Não consegui carregar os serviços. Tente novamente 🙏');
    startBookingFlow(); return;
  }

  if (!svcs.length) {
    addBellaHtml(`Não há serviços disponíveis em <strong>${cat.name}</strong> no momento 😔`);
    await new Promise(r => setTimeout(r, 400));
    addBellaHtml('Quer escolher outra categoria?');
    setChips([{ label: '← Voltar', primary: true, action: () => startBookingFlow() }]);
    return;
  }
  bk.services = svcs;

  addBellaHtml(`Aqui estão os serviços de <strong>${cat.name}</strong>:`);
  setChips(svcs.map(s => ({
    label: s.dur ? `${s.name} (${s.dur}min)` : s.name,
    action: () => pickService(s)
  })));
}

async function pickService(svc) {
  bk.procId = svc.id; bk.procName = svc.name; bk.procDur = svc.dur;
  bk.step = 'city';
  addUserMsg(svc.name);
  clearChips();

  const t = showTyping();
  let cities = [];
  try {
    // Passa procId → server filtra cidades com disponibilidade real
    const r = await fetch(`/api/bella/availability?step=cities&procId=${bk.procId}`);
    cities = await r.json();
    t.remove();
  } catch {
    t.remove();
    addBellaHtml('Erro ao carregar cidades. Tente novamente 🙏');
    return;
  }
  bk.cities = cities;

  if (!cities.length) {
    addBellaHtml('Não há disponibilidade para este serviço no momento 😔<br><br>Entre em contato pelo WhatsApp para outras opções!');
    setDefaultChips(); setInputEnabled(true); return;
  }

  if (cities.length === 1) {
    // Única cidade — pula a escolha
    bk.cityId      = cities[0].id;
    bk.cityName    = cities[0].name;
    bk.cityAddress = buildAddress(cities[0]);
    await askDate();
  } else {
    addBellaHtml('Em qual <strong>cidade</strong> você prefere ser atendida?');
    setChips(cities.map(c => ({ label: c.name, action: () => pickCity(c) })));
  }
}

function buildAddress(city) {
  const parts = [
    city.address,
    city.number ? `nº ${city.number}` : null,
    city.complement || null,
    city.neighborhood || null,
  ].filter(Boolean);
  return parts.join(', ') || null;
}

async function pickCity(city) {
  bk.cityId      = city.id;
  bk.cityName    = city.name;
  bk.cityAddress = buildAddress(city);
  addUserMsg(city.name);
  clearChips();
  await askDate();
}

async function askDate() {
  bk.step = 'date';
  const t = showTyping();
  let dates = [];
  try {
    const r = await fetch(`/api/bella/availability?step=dates&procId=${bk.procId}&cityId=${bk.cityId}`);
    dates = await r.json();
    t.remove();
  } catch {
    t.remove();
    addBellaHtml('Não consegui verificar as datas. Tente novamente 🙏');
    return;
  }

  if (!dates.length) {
    addBellaHtml('Não há datas disponíveis para este serviço no momento 😔<br><br>Entre em contato pelo WhatsApp para outras opções!');
    setDefaultChips(); setInputEnabled(true); return;
  }

  addBellaHtml('Ótimo! Escolha uma <strong>data</strong>:');
  setChips(dates.map(d => ({ label: fmtDate(d), action: () => pickDate(d) })));
}

async function pickDate(d) {
  bk.date = d; bk.step = 'slot';
  addUserMsg(fmtDate(d));
  clearChips();

  const t = showTyping();
  let slots = [];
  try {
    const r = await fetch(`/api/bella/availability?step=slots&procId=${bk.procId}&cityId=${bk.cityId}&date=${bk.date}`);
    slots = await r.json();
    t.remove();
  } catch {
    t.remove();
    addBellaHtml('Não consegui buscar os horários. Tente novamente 🙏');
    return;
  }

  if (!slots.length) {
    addBellaHtml('Não há horários disponíveis nesta data 😔');
    await new Promise(r => setTimeout(r, 400));
    await askDate(); return;
  }

  addBellaHtml('Perfeito! Escolha um <strong>horário</strong>:');
  setChips(slots.map(s => ({ label: s, action: () => pickSlot(s) })));
}

async function pickSlot(slot) {
  bk.slot = slot; bk.step = 'confirm';
  addUserMsg(slot);
  clearChips();

  const addrRow = bk.cityAddress
    ? `<div class="summary-row"><span class="summary-label">Endereço</span><span>${bk.cityAddress}</span></div>` : '';
  const cityRow = bk.cityName
    ? `<div class="summary-row"><span class="summary-label">Local</span><span>${bk.cityName}</span></div>` : '';

  addBellaHtml(
    `Aqui está o resumo do seu agendamento:<div class="summary-card">
      <h4>✨ Resumo</h4>
      <div class="summary-row"><span class="summary-label">Serviço</span><span>${bk.procName}</span></div>
      <div class="summary-row"><span class="summary-label">Data</span><span>${fmtDate(bk.date)}</span></div>
      <div class="summary-row"><span class="summary-label">Horário</span><span>${bk.slot}</span></div>
      ${cityRow}${addrRow}
    </div>`
  );

  await new Promise(r => setTimeout(r, 500));
  addBellaHtml('Posso confirmar seu agendamento? 😊');
  setChips([
    { label: '✅ Sim, confirmar!', primary: true, action: () => confirmBooking() },
    { label: '🔄 Alterar dados',   action: () => { addUserMsg('Quero alterar'); startBookingFlow(); } },
  ]);
}

// ── ICS: geração e download automático ──────────────────────────────
function downloadICS() {
  try {
    const [y, m, d] = bk.date.split('-').map(Number);
    const [h, min]  = bk.slot.split(':').map(Number);
    const dur        = bk.procDur || 60;
    const endMin     = h*60 + min + dur;
    const endH       = Math.floor(endMin / 60);
    const endM       = endMin % 60;
    const pad        = n => String(n).padStart(2, '0');
    const dtStart    = `${y}${pad(m)}${pad(d)}T${pad(h)}${pad(min)}00`;
    const dtEnd      = `${y}${pad(m)}${pad(d)}T${pad(endH)}${pad(endM)}00`;
    const stamp      = new Date().toISOString().replace(/[-:]/g,'').replace(/\..*/,'Z');
    const location   = [bk.cityName, bk.cityAddress].filter(Boolean).join(' — ');
    const escLoc     = location.replace(/,/g, '\\,');
    const summary    = bk.procName.replace(/,/g, '\\,');

    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Belle Planner//Bella Chat//PT',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      `UID:bella-${session_id}@belleplanner`,
      `DTSTAMP:${stamp}`,
      `DTSTART;TZID=America/Sao_Paulo:${dtStart}`,
      `DTEND;TZID=America/Sao_Paulo:${dtEnd}`,
      `SUMMARY:${summary}`,
      escLoc ? `LOCATION:${escLoc}` : '',
      'DESCRIPTION:Agendamento confirmado pela Bella \\u2014 Belle Planner',
      'BEGIN:VALARM',
      'TRIGGER:-P1D',
      'ACTION:DISPLAY',
      `DESCRIPTION:Lembrete: ${bk.procName} amanhã!`,
      'END:VALARM',
      'BEGIN:VALARM',
      'TRIGGER:-PT3H',
      'ACTION:DISPLAY',
      `DESCRIPTION:Lembrete: ${bk.procName} em 3 horas!`,
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ].filter(l => l !== '').join('\r\n');

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'agendamento-bella.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) {
    console.warn('Erro ao gerar ICS:', e);
  }
}

// ── Confirmação real no DB ───────────────────────────────────────────
async function confirmBooking() {
  clearChips();
  addUserMsg('Confirmar!');
  bk.step = 'done'; bk.active = false;

  const t = showTyping();
  await new Promise(r => setTimeout(r, 800));
  t.remove();

  // Calcula et (end time) a partir do slot + duração
  const [h, min] = bk.slot.split(':').map(Number);
  const dur       = bk.procDur || 60;
  const endMin    = h*60 + min + dur;
  const et        = `${String(Math.floor(endMin/60)).padStart(2,'0')}:${String(endMin%60).padStart(2,'0')}`;

  // Tenta salvar no banco
  let saved = false;
  try {
    const resp = await fetch('/api/appointments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cityId:          bk.cityId,
        cityName:        bk.cityName,
        procId:          bk.procId,
        procName:        bk.procName,
        date:            bk.date,
        st:              bk.slot,
        et:              et,
        name:            visitorName,
        phone:           visitorPhone,
        price:           null,
        pt:              'chat',
        privacy_consent: true,
      })
    });
    if (resp.status === 409) {
      // Slot tomado por outra pessoa
      addBellaHtml(
        `⚠️ Ops! Este horário acabou de ser reservado por outra pessoa 😔<br><br>` +
        `Vamos escolher outro horário?`
      );
      await new Promise(r => setTimeout(r, 400));
      bk.step = 'slot'; bk.active = true;
      await askDate();
      return;
    }
    if (resp.ok) saved = true;
  } catch (e) {
    console.warn('Erro ao salvar appointment:', e);
  }

  // Monta endereço para a confirmação
  const addrRow = bk.cityAddress
    ? `<div class="summary-row"><span class="summary-label">Endereço</span><span>${bk.cityAddress}</span></div>` : '';
  const cityRow = bk.cityName
    ? `<div class="summary-row"><span class="summary-label">Local</span><span>${bk.cityName}</span></div>` : '';

  const first = visitorName.split(' ')[0];
  addBellaHtml(
    `🎉 <strong>Perfeito, ${first}!</strong><br><br>` +
    `Seu agendamento está ${saved ? 'confirmado' : 'registrado'}!` +
    `<div class="summary-card">
      <h4>✨ Confirmação</h4>
      <div class="summary-row"><span class="summary-label">Serviço</span><span>${bk.procName}</span></div>
      <div class="summary-row"><span class="summary-label">Data</span><span>${fmtDate(bk.date)}</span></div>
      <div class="summary-row"><span class="summary-label">Horário</span><span>${bk.slot}</span></div>
      ${cityRow}${addrRow}
    </div>`
  );

  // Download ICS automático (adiciona ao calendário com alarmes)
  setTimeout(() => downloadICS(), 600);

  // Link WhatsApp + botão agenda
  const whaNum = (cfg.whatsapp_number || '').replace(/\D/g, '');
  const whaText = encodeURIComponent(
    `Olá! Confirmei meu agendamento pela Bella 🌸\n\n` +
    `📋 Serviço: ${bk.procName}\n` +
    `📅 Data: ${fmtDate(bk.date)}\n` +
    `⏰ Horário: ${bk.slot}\n` +
    (bk.cityName ? `📍 Local: ${bk.cityName}\n` : '') +
    (bk.cityAddress ? `🗺️ ${bk.cityAddress}\n` : '') +
    `\nAté logo! 💕`
  );
  const whaHref = whaNum
    ? `https://wa.me/${whaNum.startsWith('55') ? whaNum : '55' + whaNum}?text=${whaText}`
    : null;

  await new Promise(r => setTimeout(r, 500));

  addBellaHtml(
    `📲 Você pode nos enviar uma mensagem no WhatsApp para confirmar ou tirar dúvidas. ` +
    `E seu agendamento já foi <strong>adicionado à sua agenda</strong> com lembretes 🔔` +
    (whaHref
      ? `<div class="post-booking-actions">
           <a href="${whaHref}" target="_blank" class="btn-whatsapp">📲 Enviar confirmação no WhatsApp</a>
           <a onclick="downloadICS()" class="btn-calendar">📅 Baixar novamente (Agenda)</a>
         </div>`
      : `<div class="post-booking-actions">
           <a onclick="downloadICS()" class="btn-calendar">📅 Baixar (.ics) para a Agenda</a>
         </div>`)
  );

  await new Promise(r => setTimeout(r, 700));
  await askAnythingElse();
}

// ── Encerramento da conversa ─────────────────────────────────────────
async function askAnythingElse() {
  await new Promise(r => setTimeout(r, 400));
  addBellaHtml('Posso te ajudar em mais alguma coisa?');
  setChips([
    { label: 'Sim', primary: true, action: async () => {
        addUserMsg('Sim');
        clearChips();
        await new Promise(r => setTimeout(r, 350));
        addBellaHtml('Gostaria de agendar um novo procedimento?');
        setChips([
          { label: 'Sim, quero agendar', primary: true, action: async () => {
              addUserMsg('Sim, quero agendar');
              clearChips();
              await new Promise(r => setTimeout(r, 200));
              startBookingFlow();
          }},
          { label: 'Não preciso de ajuda', action: async () => {
              addUserMsg('Não preciso de ajuda');
              clearChips();
              await farewell();
          }},
          { label: 'Outra dúvida', action: async () => {
              addUserMsg('Outra dúvida');
              clearChips();
              await bellaDelay('Em que mais posso te ajudar? 😊', 400);
              setDefaultChips();
              setInputEnabled(true);
          }},
        ]);
    }},
    { label: 'Não', action: async () => {
        addUserMsg('Não');
        clearChips();
        await farewell();
    }},
  ]);
}

// ── Start ────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', init);
</script>
