name: CI — Belle Planner

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Regression Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: belle
          POSTGRES_PASSWORD: belle_test
          POSTGRES_DB: belle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://belle:belle_test@localhost:5432/belle_test
      SESSION_SECRET: test_secret_ci
      APP_URL: https://test.belleplanner.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test -- --forceExit --runInBand
